name: Portfolio checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest typer
      - run: python -m pytest portfolio/tests -q
      - run: docker build -t issue-agent-sandbox:local -f portfolio/Dockerfile .
      - run: python -m pytest portfolio/tests/test_evaluation.py -q
        env:
          RUN_DOCKER_TESTS: '1'
